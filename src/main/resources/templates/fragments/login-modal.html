<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="login-modal"
      id="login-modal"
      class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-[2px] px-4 transition-opacity"
    >
      <style>
        #login-password::-ms-reveal,
        #login-password::-ms-clear {
          display: none;
        }
      </style>

      <div
        class="bg-white rounded-2xl w-full max-w-[400px] p-8 relative shadow-2xl"
      >
        <button
          onclick="closeLoginModal()"
          class="absolute top-5 right-5 text-gray-400 hover:text-black transition-colors"
          aria-label="Cerrar modal"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <use href="/img/sprite.svg#close"></use>
          </svg>
        </button>

        <p
          class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-1"
        >
          Bienvenido
        </p>
        <h2 class="text-3xl font-black tracking-tight mb-4">Inicia sesión</h2>

        <div
          id="login-error-box"
          class="hidden mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 flex items-start space-x-2.5 text-red-600"
        >
          <svg
            class="w-5 h-5 flex-shrink-0 mt-0.5 text-red-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <span
            id="login-error-text"
            class="text-xs font-bold leading-relaxed"
          ></span>
        </div>

        <form id="form-login-ajax" class="space-y-5">
          <div>
            <label
              for="login-email"
              class="block text-sm font-bold text-gray-900 mb-2"
              >Correo electrónico</label
            >
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="tu@correo.pe"
              required
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-colors"
            />
          </div>
          <div>
            <div class="flex justify-between items-center mb-2">
              <label
                for="login-password"
                class="block text-sm font-bold text-gray-900"
                >Contraseña</label
              >
              <a
                href="#"
                class="text-xs text-gray-500 hover:text-blue-600 transition-colors"
                >¿Olvidaste tu contraseña?</a
              >
            </div>

            <div class="relative">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="••••••••"
                required
                class="w-full border border-gray-300 rounded-lg pl-4 pr-11 py-3 text-sm tracking-widest focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-colors"
              />
              <button
                type="button"
                onclick="toggleLoginPassword()"
                aria-label="Mostrar u ocultar contraseña"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-700 focus:outline-none transition-colors"
              >
                <svg
                  id="icon-eye-open"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  ></path>
                </svg>

                <svg
                  id="icon-eye-closed"
                  class="w-5 h-5 hidden"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
          <button
            type="submit"
            id="btn-login-submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg mt-2 transition-colors"
          >
            ENTRAR
          </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6 pt-2">
          ¿No tienes cuenta?
          <button
            type="button"
            onclick="switchToRegister()"
            class="text-black font-bold hover:underline"
          >
            Regístrate gratis
          </button>
        </p>
      </div>

      <script>
        function toggleLoginPassword() {
          const passwordInput = document.getElementById("login-password");
          const eyeOpen = document.getElementById("icon-eye-open");
          const eyeClosed = document.getElementById("icon-eye-closed");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            passwordInput.classList.remove("tracking-widest");
            eyeOpen.classList.add("hidden");
            eyeClosed.classList.remove("hidden");
          } else {
            passwordInput.type = "password";
            passwordInput.classList.add("tracking-widest");
            eyeOpen.classList.remove("hidden");
            eyeClosed.classList.add("hidden");
          }
        }

        document
          .getElementById("form-login-ajax")
          .addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const errorBox = document.getElementById("login-error-box");
            const errorText = document.getElementById("login-error-text");
            const submitBtn = document.getElementById("btn-login-submit");

            submitBtn.disabled = true;
            submitBtn.textContent = "VERIFICANDO...";

            try {
              const response = await fetch("/login-ajax", {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded",
                },
                body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
              });

              const data = await response.json();

              if (data.success) {
                window.location.reload();
              } else {
                errorText.textContent = data.message;
                errorBox.classList.remove("hidden");
                submitBtn.disabled = false;
                submitBtn.textContent = "ENTRAR";
              }
            } catch (err) {
              errorText.textContent =
                "Ocurrió un error de conexión. Inténtalo de nuevo.";
              errorBox.classList.remove("hidden");
              submitBtn.disabled = false;
              submitBtn.textContent = "ENTRAR";
            }
          });
      </script>
    </div>
  </body>
</html>
