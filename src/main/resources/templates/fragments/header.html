<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="header" class="bg-white py-4 px-6 lg:px-12 flex flex-col lg:flex-row justify-between items-center border-b border-gray-200 sticky top-0 z-50">  
        
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center space-x-6 lg:space-x-12">
                <div class="text-2xl font-black tracking-tighter text-black">
                    <a th:href="@{/}">LIMA BASICS</a>
                </div>
                <div id="desktop-menu" class="hidden lg:flex space-x-6 xl:space-x-8 font-medium text-sm mt-1">
                    <a th:href="@{/}" class="text-slate-500 hover:text-black transition-colors">Inicio</a>
                    <a th:href="@{/catalog}" class="text-slate-500 hover:text-black transition-colors">Catálogo</a>
                    <a th:href="@{/offers}" class="text-slate-500 hover:text-black transition-colors">Ofertas</a>
                    <a th:href="@{/about}" class="text-slate-500 hover:text-black transition-colors">Sobre Nosotros</a>
                    <a th:href="@{/contact}" class="text-slate-500 hover:text-black transition-colors">Contacto</a>
                </div>
            </div>
            
            <div class="flex space-x-5 items-center text-slate-400">
                <button aria-label="Buscar" class="hover:text-black transition-colors mt-1">
                    <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24"><use href="/img/sprite.svg#search"></use></svg>
                </button>
                
                <a th:href="@{/carrito}" aria-label="Carrito" class="relative hover:text-black transition-colors mt-1">
                    <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24"><use href="/img/sprite.svg#cart"></use></svg>
                    <span th:if="${session.carritoCantidad != null and session.carritoCantidad > 0}"
                        th:text="${session.carritoCantidad}"
                        class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                    </span>
                </a>
                                
                <button th:if="${session.usuarioId == null}" onclick="openLoginModal()" aria-label="Usuario" class="hidden lg:block hover:text-black transition-colors mt-1">
                    <svg class="w-5 h-5" viewBox="0 0 15 15"><use href="/img/sprite.svg#user"></use></svg>
                </button>

                <div th:if="${session.usuarioId != null}" class="relative hidden lg:block ml-2">
                    <button onclick="toggleUserDropdown()" class="w-[38px] h-[38px] rounded-full bg-[#2563EB] text-white font-bold text-sm flex items-center justify-center border-[3px] border-[#DBEAFE] hover:bg-blue-700 transition-colors shadow-sm focus:outline-none">
                        <span th:text="${#strings.substring(session.usuarioNombre,0,1).toUpperCase()}">M</span>
                    </button>

                    <div id="user-dropdown" class="hidden absolute right-0 top-14 mt-1 w-[220px] bg-white rounded-xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.1)] border border-gray-100 py-1 z-50">
                        <div class="px-5 py-3 border-b border-gray-100">
                            <p class="text-[15px] font-bold text-[#0F172A] leading-tight" th:text="'Hola, ' + ${session.usuarioNombre}">Hola, Marco</p>
                            <p class="text-[13px] text-gray-500 mt-0.5 truncate" th:text="${session.usuarioEmail != null ? session.usuarioEmail : 'tu@correo.pe'}">tu@correo.pe</p>
                        </div>
                        
                        <div class="py-1.5 border-b border-gray-100">
                            <a href="#" class="flex items-center px-5 py-2.5 text-sm text-[#334155] hover:bg-gray-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-[#94A3B8]"><use href="/img/sprite.svg#icon-profile"></use></svg> Mi Perfil
                            </a>
                            <a href="#" class="flex items-center px-5 py-2.5 text-sm text-[#334155] hover:bg-gray-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-[#94A3B8]"><use href="/img/sprite.svg#icon-box"></use></svg> Mis Pedidos
                            </a>
                            <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/admin/dashboard}" class="flex items-center px-5 py-2.5 text-sm font-bold text-blue-600 hover:bg-blue-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-blue-500"><use href="/img/sprite.svg#menu"></use></svg> Dashboard Admin
                            </a>
                        </div>
                        
                        <div class="py-1">
                            <form action="/logout" method="post" class="m-0 w-full">
                                <button type="submit" class="flex items-center w-full text-left px-5 py-2.5 text-sm text-[#DC2626] hover:bg-red-50 transition-colors">
                                    <svg class="w-[18px] h-[18px] mr-3 text-[#EF4444]"><use href="/img/sprite.svg#icon-logout"></use></svg> Cerrar sesión
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <button onclick="toggleMenu()" aria-label="Menú" class="lg:hidden hover:text-black transition-colors ml-2">
                    <svg id="icon-menu" class="w-6 h-6 block" viewBox="0 0 24 24"><use href="/img/sprite.svg#menu"></use></svg>
                    <svg id="icon-close" class="w-6 h-6 hidden" viewBox="0 0 24 24"><use href="/img/sprite.svg#close"></use></svg>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="hidden fixed top-[80px] bottom-6 left-4 right-4 bg-white shadow-[0_10px_40px_-15px_rgba(0,0,0,0.1)] rounded-2xl lg:hidden border border-gray-100 z-50 flex flex-col overflow-hidden">
            <div class="flex flex-col h-full px-6 py-6 justify-between overflow-y-auto">
                
                <div class="flex flex-col space-y-1">
                    <a th:href="@{/}" class="mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between">Inicio</a>
                    <a th:href="@{/catalog}" class="mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between">Catálogo</a>
                    <a th:href="@{/offers}" class="mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between">Ofertas</a>
                    <a th:href="@{/about}" class="mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between">Sobre Nosotros</a>
                    <a th:href="@{/contact}" class="mobile-link py-2.5 text-sm text-gray-600 flex items-center justify-between">Contacto</a>
                </div>

                <div class="w-full h-px bg-gray-100 my-2"></div>

                <div class="flex flex-col">
                    <button th:if="${session.usuarioId == null}" onclick="openLoginModal(); toggleMenu()" class="py-3 px-3 text-sm text-black font-bold text-left w-full flex items-center rounded-xl hover:bg-gray-50 transition-colors">
                        <svg class="w-5 h-5 mr-3 text-gray-400"><use href="/img/sprite.svg#user"></use></svg>
                        Iniciar sesión / Regístrate
                    </button>

                    <div th:if="${session.usuarioId != null}" class="flex flex-col">
                        <div class="flex items-center mb-3 px-1">
                            <div class="w-[40px] h-[40px] rounded-full bg-[#2563EB] text-white font-bold text-sm flex items-center justify-center border-[3px] border-[#DBEAFE] mr-3 shadow-sm">
                                <span th:text="${#strings.substring(session.usuarioNombre,0,1).toUpperCase()}">M</span>
                            </div>
                            <div>
                                <span th:text="'Hola, ' + ${session.usuarioNombre}" class="block text-sm font-bold text-black leading-tight"></span>
                                <span th:text="${session.usuarioEmail != null ? session.usuarioEmail : 'tu@correo.pe'}" class="block text-xs text-gray-500 mt-0.5"></span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col space-y-1">
                            <a href="#" class="flex items-center py-2 px-3 text-sm text-gray-600 rounded-xl hover:bg-gray-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-gray-400"><use href="/img/sprite.svg#icon-profile"></use></svg> Mi Perfil
                            </a>
                            <a href="#" class="flex items-center py-2 px-3 text-sm text-gray-600 rounded-xl hover:bg-gray-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-gray-400"><use href="/img/sprite.svg#icon-box"></use></svg> Mis Pedidos
                            </a>
                            <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/admin/dashboard}" class="flex items-center py-2 px-3 text-sm font-bold text-blue-600 rounded-xl hover:bg-blue-50 transition-colors">
                                <svg class="w-[18px] h-[18px] mr-3 text-blue-500"><use href="/img/sprite.svg#menu"></use></svg> Dashboard Admin
                            </a>
                        </div>
                    </div>
                </div>

                <div th:if="${session.usuarioId != null}" class="pt-2">
                    <form action="/logout" method="post" class="m-0 w-full">
                        <button type="submit" class="flex items-center justify-center w-full px-3 py-3 text-sm font-bold text-red-600 rounded-xl bg-red-50 hover:bg-red-100 transition-colors">
                            <svg class="w-[18px] h-[18px] mr-2 text-red-500"><use href="/img/sprite.svg#icon-logout"></use></svg> Cerrar sesión
                        </button>
                    </form>
                </div>

            </div>
        </div>

        <div th:if="${session.usuarioId == null}">
            <div th:replace="~{fragments/login-modal :: login-modal}"></div>
            <div th:replace="~{fragments/register-modal :: register-modal}"></div>
        </div>

        <script th:inline="javascript">
            function toggleUserDropdown() {
                const dropdown = document.getElementById('user-dropdown');
                if (dropdown) dropdown.classList.toggle('hidden');
            }

            document.addEventListener('click', function(event) {
                const dropdown = document.getElementById('user-dropdown');
                const userButton = event.target.closest('button[onclick="toggleUserDropdown()"]');
                
                if (dropdown && !dropdown.classList.contains('hidden') && !userButton && !dropdown.contains(event.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            function toggleMenu() {
                const mobileMenu = document.getElementById('mobile-menu');
                const iconMenu = document.getElementById('icon-menu');
                const iconClose = document.getElementById('icon-close');
                
                if (mobileMenu) mobileMenu.classList.toggle('hidden');
                if (iconMenu) iconMenu.classList.toggle('hidden');
                if (iconMenu) iconMenu.classList.toggle('block');
                if (iconClose) iconClose.classList.toggle('hidden');
                if (iconClose) iconClose.classList.toggle('block');
            }

            function openLoginModal() {
                const modal = document.getElementById('login-modal');
                if (modal) modal.classList.remove('hidden');
            }

            function closeLoginModal() {
                const modal = document.getElementById('login-modal');
                if (modal) modal.classList.add('hidden');
            }

            function closeRegisterModal() {
                const modal = document.getElementById('register-modal');
                if (modal) modal.classList.add('hidden');
            }

            function switchToRegister() {
                const loginModal = document.getElementById('login-modal');
                const registerModal = document.getElementById('register-modal');
                if (loginModal) loginModal.classList.add('hidden');
                if (registerModal) registerModal.classList.remove('hidden');
            }

            function switchToLogin() {
                const registerModal = document.getElementById('register-modal');
                const loginModal = document.getElementById('login-modal');
                if (registerModal) registerModal.classList.add('hidden');
                if (loginModal) loginModal.classList.remove('hidden');
            }

            document.addEventListener('DOMContentLoaded', () => {
                const currentPath = window.location.pathname; 
                
                const desktopLinks = document.querySelectorAll('#desktop-menu a');
                desktopLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.className = "text-black border-b-2 border-black pb-1"; 
                    } else {
                        link.className = "text-slate-500 hover:text-black transition-colors"; 
                    }
                });

                const mobileLinks = document.querySelectorAll('.mobile-link');
                mobileLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.className = "mobile-link py-2.5 text-sm text-black font-bold border-b border-gray-50 flex items-center justify-between";
                    } else {
                        link.className = "mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between";
                    }
                });
            });
            document.addEventListener('DOMContentLoaded', () => {
                    const currentPath = window.location.pathname; 
                    
                    const desktopLinks = document.querySelectorAll('#desktop-menu a');
                    desktopLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPath) {
                            link.className = "text-black border-b-2 border-black pb-1"; 
                        } else {
                            link.className = "text-slate-500 hover:text-black transition-colors"; 
                        }
                    });

                    const mobileLinks = document.querySelectorAll('.mobile-link');
                    mobileLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPath) {
                            link.className = "mobile-link py-2.5 text-sm text-black font-bold border-b border-gray-50 flex items-center justify-between";
                        } else {
                            link.className = "mobile-link py-2.5 text-sm text-gray-600 border-b border-gray-50 flex items-center justify-between";
                        }
                    });

                    const debeAbrirLogin = /*[[${openLogin}]]*/ false;
                    const debeAbrirRegistro = /*[[${openRegister}]]*/ false;

                    if (debeAbrirLogin) {
                        openLoginModal();
                    } else if (debeAbrirRegistro) {
                        const regModal = document.getElementById('register-modal');
                        if (regModal) regModal.classList.remove('hidden');
                    }
                });
        </script>
    </nav>
</body>
</html>
