<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Definimos el fragmento llamado 'navbar' -->
    <nav th:fragment="navbar" class="bg-white text-black py-4 px-6 md:px-12 flex justify-between items-center border-b border-gray-200 sticky top-0 z-50">
        <div class="text-2xl font-black tracking-tighter">
            <a th:href="@{/}">LIMA BASICS</a>

        <div class="hidden md:flex space-x-8 font-medium text-sm">
