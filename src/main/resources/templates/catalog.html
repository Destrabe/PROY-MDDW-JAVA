<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lima Basics | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-gray-900 font-sans antialiased flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow max-w-7xl mx-auto px-6 md:px-12 w-full py-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 pb-6 border-b border-gray-200">
            <div>
                <h1 class="text-4xl font-black tracking-tighter">Catálogo</h1>
                <p class="text-gray-500 mt-2" th:text="${productos.size()} + ' productos encontrados'"></p>
            </div>
            <div class="mt-4 md:mt-0 w-full md:w-auto">
                <select class="w-full md:w-48 border border-gray-300 rounded-md px-4 py-2 text-sm focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 bg-white">
                    <option>Relevancia</option>
                    <option>Menor precio</option>
                    <option>Mayor precio</option>
                    <option>Lo más nuevo</option>
                </select>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-10">
            <aside class="w-full lg:w-64 flex-shrink-0">
                <div class="mb-8">
                    <h3 class="font-bold mb-4 uppercase tracking-wider text-sm">Categoría</h3>
                    <ul class="space-y-1">
                        <li><a href="#" class="block bg-gray-900 text-white px-4 py-2.5 rounded text-sm font-medium">Todos</a></li>
                        <li><a href="#" class="block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 py-2.5 rounded text-sm transition-colors">Polos</a></li>
                        <li><a href="#" class="block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 py-2.5 rounded text-sm transition-colors">Hoodies</a></li>
                        <li><a href="#" class="block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 py-2.5 rounded text-sm transition-colors">Pantalones</a></li>
                        <li><a href="#" class="block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 py-2.5 rounded text-sm transition-colors">Chaquetas</a></li>
                        <li><a href="#" class="block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 py-2.5 rounded text-sm transition-colors">Shorts</a></li>
                    </ul>
                </div>

                <div class="mb-8">
                    <h3 class="font-bold mb-4 uppercase tracking-wider text-sm">Talla</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">XS</button>
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">S</button>
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">M</button>
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">L</button>
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">XL</button>
                        <button class="border border-gray-300 py-2 text-sm text-center hover:border-gray-900 rounded transition-colors focus:ring-2 focus:ring-gray-900">2XL</button>
                    </div>
                </div>

                <div class="mb-8">
                    <h3 class="font-bold mb-4 uppercase tracking-wider text-sm">Color</h3>
                    <div class="flex flex-wrap gap-3">
                        <button class="w-8 h-8 rounded-full bg-black border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-gray-900" aria-label="Negro"></button>
                        <button class="w-8 h-8 rounded-full bg-white border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-gray-900" aria-label="Blanco"></button>
                        <button class="w-8 h-8 rounded-full bg-[#6b705c] border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-[#6b705c]" aria-label="Verde Oliva"></button>
                        <button class="w-8 h-8 rounded-full bg-[#cb997e] border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-[#cb997e]" aria-label="Arcilla"></button>
                        <button class="w-8 h-8 rounded-full bg-[#ddbea9] border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-[#ddbea9]" aria-label="Beige"></button>
                        <button class="w-8 h-8 rounded-full bg-[#1b263b] border border-gray-300 focus:ring-2 focus:ring-offset-2 focus:ring-[#1b263b]" aria-label="Azul Marino"></button>
                    </div>
                </div>

                <div class="mb-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold uppercase tracking-wider text-sm">Precio Máximo:</h3>
                        <span class="text-blue-600 font-bold text-sm">S/ 300</span>
                    </div>
                    <input type="range" min="50" max="300" value="300" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    <div class="flex justify-between text-xs text-gray-500 mt-2">
                        <span>S/ 50</span>
                        <span>S/ 300</span>
                    </div>
                </div>
            </aside>

            <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-10">
                <div class="group cursor-pointer" th:each="producto : ${productos}">
                    <div class="relative bg-gray-100 aspect-[3/4] mb-4 overflow-hidden rounded">
                        <span th:if="${producto.etiqueta != null}" 
                              th:class="'absolute top-3 left-3 text-white text-[10px] font-bold px-2 py-1 uppercase tracking-wider rounded-sm z-10 ' + ${producto.claseEtiqueta}"
                              th:text="${producto.etiqueta}"></span>
                        <img th:src="${producto.imagen}" th:alt="${producto.nombre}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <p class="text-xs text-gray-500 uppercase tracking-widest mb-1" th:text="${producto.categoria}"></p>
                    <h3 class="font-bold text-lg leading-tight mb-1" th:text="${producto.nombre}"></h3>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="font-black text-lg" th:text="'S/ ' + ${producto.precio}"></span>
                        <span th:if="${producto.precioAnterior != null}" class="text-gray-400 line-through text-sm" th:text="'S/ ' + ${producto.precioAnterior}"></span>
                    </div>
                    <div class="flex gap-1.5" th:if="${producto.colores != null}">
                        <div th:each="color : ${producto.colores}" th:class="'w-4 h-4 rounded-full border border-gray-300 ' + ${color}"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
