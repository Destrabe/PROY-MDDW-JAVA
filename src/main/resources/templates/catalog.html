<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lima Basics | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-white text-gray-900 font-sans antialiased flex flex-col min-h-screen"
  >
    <div th:replace="~{fragments/header :: header}"></div>

    <main
      class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 md:px-12 w-full py-6 md:py-10"
    >
      <div
        class="flex flex-row justify-between items-start md:items-end mb-6 md:mb-10 pb-5 md:pb-6 border-b border-gray-200 gap-3"
      >
        <div>
          <h1
            class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tighter leading-none"
          >
            Catálogo
          </h1>
          <p
            id="contador-productos"
            class="text-xs sm:text-sm text-gray-500 mt-1.5 leading-snug max-w-[120px] sm:max-w-none"
            th:text="${productos.size()} + ' productos encontrados'"
          ></p>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
          <label
            for="select-orden"
            class="text-xs font-bold uppercase tracking-wider text-gray-400 hidden md:block"
            >Ordenar por:</label
          >
          <select
            id="select-orden"
            onchange="aplicarFiltrosYOrden()"
            class="border border-gray-200 rounded-lg px-2.5 sm:px-3.5 py-2 text-xs sm:text-sm text-gray-700 focus:outline-none focus:border-gray-900 bg-white cursor-pointer"
          >
            <option value="relevancia">Relevancia</option>
            <option value="menor-precio">Menor precio</option>
            <option value="mayor-precio">Mayor precio</option>
            <option value="nuevo">Lo más nuevo</option>
          </select>

          <button
            type="button"
            onclick="abrirFiltrosMobile()"
            class="lg:hidden inline-flex items-center gap-1.5 border border-gray-200 rounded-lg px-3 py-2 text-xs sm:text-sm font-medium text-gray-700 hover:bg-gray-50 bg-white transition-colors"
          >
            <svg
              class="w-3.5 h-3.5 text-gray-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h10M4 18h6"
              ></path>
            </svg>
            <span>Filtros</span>
          </button>
        </div>
      </div>

      <div
        id="overlay-filtros-mobile"
        onclick="cerrarFiltrosMobile()"
        class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-[80] hidden lg:hidden transition-opacity"
      ></div>

      <div class="flex flex-col lg:flex-row gap-10">
        <aside
          id="aside-filtros"
          class="fixed inset-y-0 left-0 z-[90] w-[78%] max-w-[310px] bg-white flex flex-col justify-between transform -translate-x-full transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:w-64 lg:max-w-none lg:bg-transparent lg:z-auto flex-shrink-0 shadow-2xl lg:shadow-none"
        >
          <div
            class="flex justify-between items-center px-5 py-4 border-b border-gray-100 lg:hidden"
          >
            <span class="font-bold text-base text-gray-900">Filtros</span>
            <button
              type="button"
              onclick="cerrarFiltrosMobile()"
              class="w-7 h-7 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-900 hover:bg-gray-100 transition-colors"
              aria-label="Cerrar filtros"
            >
              <i class="fas fa-times text-sm"></i>
            </button>
          </div>

          <div class="p-5 lg:p-0 overflow-y-auto flex-grow">
            <div class="mb-7">
              <div class="flex justify-between items-center mb-3">
                <h3
                  class="font-bold uppercase tracking-wider text-[11px] text-gray-500 lg:text-sm lg:text-gray-900"
                >
                  Categoría
                </h3>
                <button
                  type="button"
                  id="btn-limpiar-lateral"
                  onclick="restablecerFiltros()"
                  class="hidden text-xs font-bold text-blue-600 hover:underline"
                >
                  Limpiar todo
                </button>
              </div>
              <ul class="space-y-1" id="lista-categorias">
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Todos', this)"
                    class="cat-btn w-full text-left block bg-gray-900 text-white px-3.5 py-2 rounded-lg text-sm font-bold transition-colors"
                  >
                    Todos
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Polos', this)"
                    class="cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors"
                  >
                    Polos
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Hoodies', this)"
                    class="cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors"
                  >
                    Hoodies
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Pantalones', this)"
                    class="cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors"
                  >
                    Pantalones
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Chaquetas', this)"
                    class="cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors"
                  >
                    Chaquetas
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    onclick="filtrarCategoria('Shorts', this)"
                    class="cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors"
                  >
                    Shorts
                  </button>
                </li>
              </ul>
            </div>

            <div class="mb-7">
              <div class="flex justify-between items-center mb-3">
                <h3
                  class="font-bold uppercase tracking-wider text-[11px] text-gray-500 lg:text-sm lg:text-gray-900"
                >
                  Talla
                </h3>
                <span
                  id="etiqueta-talla-activa"
                  class="text-xs text-blue-600 font-bold hidden"
                ></span>
              </div>
              <div
                class="flex flex-wrap gap-2 lg:grid lg:grid-cols-3"
                id="filtro-tallas"
              >
                <button
                  type="button"
                  onclick="filtrarTalla('XS', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  XS
                </button>
                <button
                  type="button"
                  onclick="filtrarTalla('S', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  S
                </button>
                <button
                  type="button"
                  onclick="filtrarTalla('M', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  M
                </button>
                <button
                  type="button"
                  onclick="filtrarTalla('L', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  L
                </button>
                <button
                  type="button"
                  onclick="filtrarTalla('XL', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  XL
                </button>
                <button
                  type="button"
                  onclick="filtrarTalla('2XL', this)"
                  class="talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors"
                >
                  2XL
                </button>
              </div>
            </div>

            <div class="mb-7">
              <div class="flex justify-between items-center mb-3">
                <h3
                  class="font-bold uppercase tracking-wider text-[11px] text-gray-500 lg:text-sm lg:text-gray-900"
                >
                  Color
                </h3>
                <span
                  id="etiqueta-color-activo"
                  class="text-xs font-mono text-gray-500"
                  >Todos</span
                >
              </div>
              <div
                id="filtro-colores-contenedor"
                class="flex flex-wrap gap-2.5"
              ></div>
            </div>

            <div class="mb-4">
              <div class="flex items-center gap-1.5 mb-3">
                <h3
                  class="font-bold uppercase tracking-wider text-[11px] text-gray-500 lg:text-sm lg:text-gray-900"
                >
                  Precio Máximo:
                </h3>
                <span
                  id="precio-max-valor"
                  class="text-blue-600 font-bold text-xs lg:text-sm"
                  >S/ 300</span
                >
              </div>
              <input
                type="range"
                id="rango-precio"
                min="50"
                max="300"
                step="5"
                value="300"
                oninput="actualizarPrecioMaximo(this.value)"
                class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
              />
              <div class="flex justify-between text-[11px] text-gray-400 mt-2">
                <span>S/ 50</span>
                <span id="precio-tope-label">S/ 300</span>
              </div>
            </div>
          </div>

          <div class="p-5 border-t border-gray-100 lg:hidden bg-white">
            <button
              type="button"
              id="btn-ver-productos-mobile"
              onclick="cerrarFiltrosMobile()"
              class="w-full bg-[#0f1115] hover:bg-black text-white font-bold text-xs py-3.5 rounded-lg transition-colors"
              th:text="'Ver ' + ${productos.size()} + ' productos'"
            >
              Ver productos
            </button>
          </div>
        </aside>

        <div class="flex-grow">
          <div
            id="grid-productos"
            class="grid grid-cols-2 md:grid-cols-3 gap-x-3.5 sm:gap-x-6 gap-y-7 sm:gap-y-10"
          >
            <div
              class="producto-card group cursor-pointer"
              th:each="producto, iterStat : ${productos}"
              th:data-index="${iterStat.index}"
              th:data-id="${producto.id}"
              th:data-nombre="${producto.nombre}"
              th:data-categoria="${producto.categoria}"
              th:data-precio="${producto.precio}"
              th:data-etiqueta="${producto.etiqueta != null ? producto.etiqueta : ''}"
              th:data-colores="${producto.colores != null ? #strings.listJoin(producto.colores, ',') : ''}"
              th:data-tallas="'XS,S,M,L,XL,2XL'"
              onclick="abrirModalDesdeCard(this, event)"
            >
              <div
                class="relative bg-gray-100 aspect-[3/4] mb-2.5 sm:mb-4 overflow-hidden rounded-lg"
              >
                <span
                  th:if="${producto.etiqueta != null and !producto.etiqueta.isEmpty()}"
                  th:class="'absolute top-2.5 left-2.5 text-white text-[9px] sm:text-[10px] font-bold px-2.5 py-1 uppercase tracking-wider rounded-full z-10 ' + ${producto.claseEtiqueta}"
                  th:text="${producto.etiqueta}"
                ></span>

                <img
                  th:src="${producto.imagen}"
                  th:alt="${producto.nombre}"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                />

                <div
                  class="absolute inset-0 bg-black/25 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-2.5 sm:p-4"
                >
                  <button
                    type="button"
                    th:data-id="${producto.id}"
                    th:data-nombre="${producto.nombre}"
                    th:data-categoria="${producto.categoria}"
                    th:data-precio="${producto.precio}"
                    th:data-precio-anterior="${producto.precioAnterior}"
                    th:data-imagen="${producto.imagen}"
                    th:data-colores="${producto.colores != null ? #strings.listJoin(producto.colores, ',') : ''}"
                    onclick="
                      event.stopPropagation();
                      abrirModalInteres(this);
                    "
                    class="btn-disparador-modal w-full bg-white/95 hover:bg-black hover:text-white text-gray-900 font-bold text-[10px] sm:text-xs uppercase tracking-wider py-2.5 sm:py-3.5 px-2 sm:px-4 rounded shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 flex items-center justify-center gap-1.5"
                  >
                    <span>agregar al carrito</span>
                    <i class="fas fa-arrow-right text-[10px]"></i>
                  </button>
                </div>
              </div>

              <p
                class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-widest mb-0.5"
                th:text="${producto.categoria}"
              ></p>
              <h3
                class="font-semibold sm:font-bold text-xs sm:text-lg leading-snug mb-1 text-gray-900 line-clamp-1"
                th:text="${producto.nombre}"
              ></h3>
              <div class="flex items-center gap-1.5 sm:gap-2 mb-2">
                <span
                  class="font-black text-xs sm:text-lg text-gray-900"
                  th:text="'S/ ' + ${producto.precio}"
                ></span>
                <span
                  th:if="${producto.precioAnterior != null}"
                  class="text-gray-400 line-through text-[11px] sm:text-sm"
                  th:text="'S/ ' + ${producto.precioAnterior}"
                ></span>
              </div>
              <div class="flex gap-1.5" th:if="${producto.colores != null}">
                <div
                  th:each="color : ${producto.colores}"
                  th:class="'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border border-gray-300 ' + ${color}"
                ></div>
              </div>
            </div>
          </div>

          <div
            id="sin-resultados"
            class="hidden text-center py-20 px-4 bg-gray-50 rounded-2xl border border-gray-100"
          >
            <i class="fas fa-search text-3xl text-gray-300 mb-3 block"></i>
            <h3 class="text-lg font-bold text-gray-900 mb-1">
              No encontramos prendas con esos filtros
            </h3>
            <p class="text-sm text-gray-500 mb-5">
              Prueba ajustando el rango de precio, el color o la categoría
              seleccionada.
            </p>
            <button
              type="button"
              onclick="restablecerFiltros()"
              class="bg-gray-900 hover:bg-black text-white text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-lg transition-colors"
            >
              Restablecer filtros
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL DE SELECCIÓN DE COLOR, TALLA, CANTIDAD Y CARRITO -->
    <div
      id="modal-interes"
      class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-[2px] px-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md overflow-hidden relative shadow-2xl"
      >
        <button
          type="button"
          onclick="cerrarModalInteres()"
          class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/80 hover:bg-gray-100 text-gray-500 hover:text-black flex items-center justify-center z-10 transition-colors"
        >
          <i class="fas fa-times"></i>
        </button>

        <form
          id="form-agregar-carrito"
          th:action="@{/cart/agregar-ajax}"
          method="post"
          class="p-6"
          onsubmit="agregarAlCarritoSinRecargar(event)"
        >
          <input type="hidden" id="modal-prod-id" name="productoId" />
          <input
            type="hidden"
            id="modal-color-seleccionado"
            name="color"
            required
          />
          <input
            type="hidden"
            id="modal-talla-seleccionada"
            name="talla"
            value="M"
          />

          <div class="flex gap-4 items-center pb-5 border-b border-gray-100">
            <img
              id="modal-prod-img"
              src=""
              alt="Producto"
              class="w-20 h-24 object-cover rounded-lg border border-gray-200 flex-shrink-0 bg-gray-100"
            />
            <div>
              <span
                id="modal-prod-cat"
                class="text-[11px] font-bold uppercase tracking-widest text-blue-600 block mb-0.5"
              ></span>
              <h3
                id="modal-prod-nombre"
                class="text-xl font-black tracking-tight text-gray-900 leading-snug"
              ></h3>
              <div class="flex items-center gap-2 mt-1">
                <span
                  id="modal-prod-precio"
                  class="font-black text-lg text-gray-900"
                ></span>
                <span
                  id="modal-prod-precio-ant"
                  class="text-gray-400 line-through text-sm hidden"
                ></span>
              </div>
            </div>
          </div>

          <div class="py-4 border-b border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <label
                class="block text-xs font-bold uppercase tracking-wider text-gray-700"
                >Escoge el color de la prenda</label
              >
              <span
                id="modal-color-etiqueta"
                class="text-xs font-mono text-gray-500"
              ></span>
            </div>
            <div
              id="modal-colores-contenedor"
              class="flex flex-wrap gap-3"
            ></div>
          </div>

          <div class="py-4 border-b border-gray-100">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2.5"
              >Talla</label
            >
            <div class="grid grid-cols-6 gap-2" id="modal-tallas-contenedor">
              <button
                type="button"
                onclick="seleccionarTallaModal('XS', this)"
                class="talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors"
              >
                XS
              </button>
              <button
                type="button"
                onclick="seleccionarTallaModal('S', this)"
                class="talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors"
              >
                S
              </button>
              <button
                type="button"
                onclick="seleccionarTallaModal('M', this)"
                class="talla-btn border-2 border-gray-900 bg-gray-900 text-white py-2 text-xs font-bold rounded transition-colors"
              >
                M
              </button>
              <button
                type="button"
                onclick="seleccionarTallaModal('L', this)"
                class="talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors"
              >
                L
              </button>
              <button
                type="button"
                onclick="seleccionarTallaModal('XL', this)"
                class="talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors"
              >
                XL
              </button>
              <button
                type="button"
                onclick="seleccionarTallaModal('2XL', this)"
                class="talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors"
              >
                2XL
              </button>
            </div>
          </div>

          <!-- Selector de Cantidad -->
          <div class="py-4 flex items-center justify-between">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-700"
              >Cantidad</label
            >
            <div
              class="flex items-center border border-gray-300 rounded-lg overflow-hidden bg-gray-50"
            >
              <button
                type="button"
                onclick="cambiarCantidad(-1)"
                class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors"
              >
                <i class="fas fa-minus text-xs"></i>
              </button>
              <input
                type="number"
                id="modal-cantidad"
                name="cantidad"
                value="1"
                min="1"
                max="99"
                class="w-12 text-center bg-transparent text-sm font-bold text-gray-900 focus:outline-none"
                readonly
              />
              <button
                type="button"
                onclick="cambiarCantidad(1)"
                class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors"
              >
                <i class="fas fa-plus text-xs"></i>
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button
              th:if="${session.usuarioId != null}"
              type="submit"
              id="btn-submit-carrito"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider"
            >
              <i class="fas fa-shopping-cart"></i>
              <span>Agregar al carrito</span>
            </button>

            <div th:if="${session.usuarioId == null}" class="space-y-2.5">
              <p class="text-xs text-center text-gray-500">
                Debes iniciar sesión para agregar prendas a tu carrito.
              </p>
              <button
                type="button"
                onclick="irALoginDesdeModal()"
                class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider"
              >
                <i class="fas fa-sign-in-alt"></i>
                <span>Iniciar sesión para comprar</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- TOAST FLOTANTE -->
    <div
      id="toast-carrito"
      class="fixed bottom-6 right-6 z-[110] hidden transform translate-y-4 opacity-0 transition-all duration-300 bg-gray-900 text-white px-5 py-4 rounded-xl shadow-2xl flex items-center space-x-3"
    >
      <div
        class="w-7 h-7 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center flex-shrink-0"
      >
        <i class="fas fa-check text-sm"></i>
      </div>
      <div>
        <p class="text-sm font-bold leading-tight">¡Agregado al carrito!</p>
        <p id="toast-detalle" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <a
        th:href="@{/cart}"
        class="ml-3 text-xs font-bold text-blue-400 hover:text-blue-300 underline uppercase tracking-wider"
      >
        Ver carrito
      </a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
      let toastTimeout = null;

      const estadoFiltros = {
        categoria: "Todos",
        talla: null,
        color: null,
        precioMax: 300,
        orden: "relevancia",
      };

      function abrirFiltrosMobile() {
        const aside = document.getElementById("aside-filtros");
        const overlay = document.getElementById("overlay-filtros-mobile");
        aside.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }

      function cerrarFiltrosMobile() {
        const aside = document.getElementById("aside-filtros");
        const overlay = document.getElementById("overlay-filtros-mobile");
        aside.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
        document.body.style.overflow = "";
      }

      function abrirModalDesdeCard(card, event) {
        const btn = card.querySelector(".btn-disparador-modal");
        if (btn) abrirModalInteres(btn);
      }

      function cambiarCantidad(delta) {
        const input = document.getElementById("modal-cantidad");
        let valorActual = parseInt(input.value) || 1;
        let nuevoValor = valorActual + delta;
        if (nuevoValor < 1) nuevoValor = 1;
        if (nuevoValor > 99) nuevoValor = 99;
        input.value = nuevoValor;
      }

      function claseTailwindAColorCSS(clase) {
        const limpia = (clase || "").trim().toLowerCase();

        const colores = {
          "bg-white": { hex: "#FFFFFF", nombre: "Blanco" },
          "bg-black": { hex: "#000000", nombre: "Negro" },
          "bg-gray-200": { hex: "#E5E7EB", nombre: "Gris Claro" },
          "bg-gray-400": { hex: "#9CA3AF", nombre: "Gris" },
          "bg-gray-500": { hex: "#6B7280", nombre: "Gris Oscuro" },
          "bg-red-500": { hex: "#EF4444", nombre: "Rojo" },
          "bg-[#ff0000]": { hex: "#FF0000", nombre: "Rojo" },
          "bg-[#8b7355]": { hex: "#8B7355", nombre: "Marrón" },
          "bg-[#6b705c]": { hex: "#6B705C", nombre: "Verde Oliva" },
          "bg-[#cb997e]": { hex: "#CB997E", nombre: "Arcilla" },
          "bg-[#ddbea9]": { hex: "#DDBEA9", nombre: "Beige" },
          "bg-[#1b263b]": { hex: "#1B263B", nombre: "Azul Marino" },
          "bg-[#fbff00]": { hex: "#FBFF00", nombre: "Amarillo" },
        };

        if (colores[limpia]) {
          return {
            hex: colores[limpia].hex,
            nombre: colores[limpia].nombre,
            clave: clase,
          };
        }

        const match = limpia.match(/bg-\[(#[0-9a-f]{3,6})\]/);
        if (match) {
          const hexUpper = match[1].toUpperCase();
          return { hex: hexUpper, nombre: "Color " + hexUpper, clave: clase };
        }

        if (limpia.startsWith("#")) {
          return {
            hex: limpia.toUpperCase(),
            nombre: "Color " + limpia.toUpperCase(),
            clave: clase,
          };
        }

        return { hex: "#000000", nombre: clase, clave: clase };
      }

      document.addEventListener("DOMContentLoaded", () => {
        const tarjetas = Array.from(
          document.querySelectorAll(".producto-card"),
        );
        const mapaColores = new Map();
        let maxPrecioDetectado = 300;

        tarjetas.forEach((card) => {
          const precio = parseFloat(card.dataset.precio) || 0;
          if (precio > maxPrecioDetectado)
            maxPrecioDetectado = Math.ceil(precio / 10) * 10;

          const coloresStr = card.dataset.colores || "";
          coloresStr
            .split(",")
            .map((c) => c.trim())
            .filter((c) => c !== "")
            .forEach((clase) => {
              const info = claseTailwindAColorCSS(clase);
              if (!mapaColores.has(info.hex)) {
                mapaColores.set(info.hex, info);
              }
            });
        });

        const sliderPrecio = document.getElementById("rango-precio");
        sliderPrecio.max = maxPrecioDetectado;
        sliderPrecio.value = maxPrecioDetectado;
        estadoFiltros.precioMax = maxPrecioDetectado;
        document.getElementById("precio-max-valor").textContent =
          "S/ " + maxPrecioDetectado;
        document.getElementById("precio-tope-label").textContent =
          "S/ " + maxPrecioDetectado;

        const contenedorColoresFiltro = document.getElementById(
          "filtro-colores-contenedor",
        );
        contenedorColoresFiltro.innerHTML = "";

        mapaColores.forEach((info) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.hex = info.hex;
          btn.title = info.nombre;
          btn.style.backgroundColor = info.hex;
          btn.className =
            "color-filtro-btn w-8 h-8 rounded-full border border-gray-300 transition-all focus:outline-none hover:scale-105";
          btn.onclick = () => filtrarColor(info.hex, info.nombre, btn);
          contenedorColoresFiltro.appendChild(btn);
        });
      });

      function filtrarCategoria(categoria, btnElemento) {
        estadoFiltros.categoria = categoria;

        document
          .querySelectorAll("#lista-categorias .cat-btn")
          .forEach((btn) => {
            btn.className =
              "cat-btn w-full text-left block text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-3.5 py-2 rounded-lg text-sm transition-colors";
          });
        btnElemento.className =
          "cat-btn w-full text-left block bg-gray-900 text-white px-3.5 py-2 rounded-lg text-sm font-bold transition-colors";

        aplicarFiltrosYOrden();
      }

      function filtrarTalla(talla, btnElemento) {
        const etiquetaTalla = document.getElementById("etiqueta-talla-activa");

        if (estadoFiltros.talla === talla) {
          estadoFiltros.talla = null;
          etiquetaTalla.classList.add("hidden");
        } else {
          estadoFiltros.talla = talla;
          etiquetaTalla.textContent = "Talla " + talla;
          etiquetaTalla.classList.remove("hidden");
        }

        document
          .querySelectorAll("#filtro-tallas .talla-filtro-btn")
          .forEach((btn) => {
            if (btn.textContent.trim() === estadoFiltros.talla) {
              btn.className =
                "talla-filtro-btn min-w-[44px] border-2 border-gray-900 bg-gray-900 text-white py-2 px-2.5 text-xs sm:text-sm font-bold text-center rounded-md transition-colors";
            } else {
              btn.className =
                "talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors";
            }
          });

        aplicarFiltrosYOrden();
      }

      function filtrarColor(hex, nombre, btnElemento) {
        const etiquetaColor = document.getElementById("etiqueta-color-activo");

        if (estadoFiltros.color === hex) {
          estadoFiltros.color = null;
          etiquetaColor.textContent = "Todos";
        } else {
          estadoFiltros.color = hex;
          etiquetaColor.textContent = nombre;
        }

        document
          .querySelectorAll("#filtro-colores-contenedor .color-filtro-btn")
          .forEach((btn) => {
            if (btn.dataset.hex === estadoFiltros.color) {
              btn.classList.add(
                "ring-2",
                "ring-offset-2",
                "ring-gray-900",
                "scale-110",
              );
            } else {
              btn.classList.remove(
                "ring-2",
                "ring-offset-2",
                "ring-gray-900",
                "scale-110",
              );
            }
          });

        aplicarFiltrosYOrden();
      }

      function actualizarPrecioMaximo(valor) {
        estadoFiltros.precioMax = parseFloat(valor);
        document.getElementById("precio-max-valor").textContent = "S/ " + valor;
        aplicarFiltrosYOrden();
      }

      function aplicarFiltrosYOrden() {
        const grid = document.getElementById("grid-productos");
        const tarjetas = Array.from(grid.querySelectorAll(".producto-card"));
        const ordenSeleccionado = document.getElementById("select-orden").value;
        estadoFiltros.orden = ordenSeleccionado;

        let visibles = 0;

        tarjetas.forEach((card) => {
          const catProd = (card.dataset.categoria || "").trim().toLowerCase();
          const precioProd = parseFloat(card.dataset.precio) || 0;
          const tallasProd = (card.dataset.tallas || "")
            .split(",")
            .map((t) => t.trim());
          const coloresHexProd = (card.dataset.colores || "")
            .split(",")
            .map((c) => c.trim())
            .filter((c) => c !== "")
            .map((c) => claseTailwindAColorCSS(c).hex);

          const cumpleCategoria =
            estadoFiltros.categoria === "Todos" ||
            catProd === estadoFiltros.categoria.toLowerCase();
          const cumplePrecio = precioProd <= estadoFiltros.precioMax;
          const cumpleTalla =
            !estadoFiltros.talla || tallasProd.includes(estadoFiltros.talla);
          const cumpleColor =
            !estadoFiltros.color ||
            coloresHexProd.includes(estadoFiltros.color);

          if (cumpleCategoria && cumplePrecio && cumpleTalla && cumpleColor) {
            card.classList.remove("hidden");
            visibles++;
          } else {
            card.classList.add("hidden");
          }
        });

        tarjetas.sort((a, b) => {
          const precioA = parseFloat(a.dataset.precio) || 0;
          const precioB = parseFloat(b.dataset.precio) || 0;
          const indexA = parseInt(a.dataset.index) || 0;
          const indexB = parseInt(b.dataset.index) || 0;
          const idA = parseInt(a.dataset.id) || 0;
          const idB = parseInt(b.dataset.id) || 0;
          const esNuevoA =
            (a.dataset.etiqueta || "").toLowerCase() === "nuevo" ? 1 : 0;
          const esNuevoB =
            (b.dataset.etiqueta || "").toLowerCase() === "nuevo" ? 1 : 0;

          if (ordenSeleccionado === "menor-precio") return precioA - precioB;
          if (ordenSeleccionado === "mayor-precio") return precioB - precioA;
          if (ordenSeleccionado === "nuevo") {
            if (esNuevoB !== esNuevoA) return esNuevoB - esNuevoA;
            return idB - idA;
          }
          return indexA - indexB;
        });

        tarjetas.forEach((card) => grid.appendChild(card));

        document.getElementById("contador-productos").textContent =
          visibles === 1
            ? "1 producto encontrado"
            : `${visibles} productos encontrados`;

        const btnMobileVer = document.getElementById(
          "btn-ver-productos-mobile",
        );
        if (btnMobileVer) {
          btnMobileVer.textContent =
            visibles === 1 ? "Ver 1 producto" : `Ver ${visibles} productos`;
        }

        const sinResultados = document.getElementById("sin-resultados");
        if (visibles === 0) {
          sinResultados.classList.remove("hidden");
          grid.classList.add("hidden");
        } else {
          sinResultados.classList.add("hidden");
          grid.classList.remove("hidden");
        }

        const sliderMax = parseFloat(
          document.getElementById("rango-precio").max,
        );
        const hayFiltroActivo =
          estadoFiltros.categoria !== "Todos" ||
          estadoFiltros.talla !== null ||
          estadoFiltros.color !== null ||
          estadoFiltros.precioMax < sliderMax;
        document
          .getElementById("btn-limpiar-lateral")
          .classList.toggle("hidden", !hayFiltroActivo);
      }

      function restablecerFiltros() {
        const slider = document.getElementById("rango-precio");
        slider.value = slider.max;
        estadoFiltros.precioMax = parseFloat(slider.max);
        document.getElementById("precio-max-valor").textContent =
          "S/ " + slider.max;

        estadoFiltros.talla = null;
        document
          .getElementById("etiqueta-talla-activa")
          .classList.add("hidden");
        document
          .querySelectorAll("#filtro-tallas .talla-filtro-btn")
          .forEach((btn) => {
            btn.className =
              "talla-filtro-btn min-w-[44px] border border-gray-200 py-2 px-2.5 text-xs sm:text-sm text-center hover:border-gray-900 rounded-md transition-colors";
          });

        estadoFiltros.color = null;
        document.getElementById("etiqueta-color-activo").textContent = "Todos";
        document
          .querySelectorAll("#filtro-colores-contenedor .color-filtro-btn")
          .forEach((btn) => {
            btn.classList.remove(
              "ring-2",
              "ring-offset-2",
              "ring-gray-900",
              "scale-110",
            );
          });

        document.getElementById("select-orden").value = "relevancia";

        const btnTodos = document.querySelector("#lista-categorias .cat-btn");
        filtrarCategoria("Todos", btnTodos);
      }

      function abrirModalInteres(btn) {
        const id = btn.dataset.id;
        const nombre = btn.dataset.nombre;
        const categoria = btn.dataset.categoria;
        const precio = btn.dataset.precio;
        const precioAnt = btn.dataset.precioAnterior;
        const imagen = btn.dataset.imagen;
        const coloresRaw = btn.dataset.colores || "bg-black";

        document.getElementById("modal-prod-id").value = id;
        document.getElementById("modal-prod-nombre").textContent = nombre;
        document.getElementById("modal-prod-cat").textContent = categoria;
        document.getElementById("modal-prod-precio").textContent =
          "S/ " + precio;
        document.getElementById("modal-prod-img").src = imagen;
        document.getElementById("modal-cantidad").value = 1; // Reiniciar cantidad a 1 al abrir

        const precioAntEl = document.getElementById("modal-prod-precio-ant");
        if (precioAnt && precioAnt !== "null" && precioAnt !== "") {
          precioAntEl.textContent = "S/ " + precioAnt;
          precioAntEl.classList.remove("hidden");
        } else {
          precioAntEl.classList.add("hidden");
        }

        const contenedorColores = document.getElementById(
          "modal-colores-contenedor",
        );
        contenedorColores.innerHTML = "";

        const listaColores = coloresRaw
          .split(",")
          .map((c) => c.trim())
          .filter((c) => c !== "");
        if (listaColores.length === 0) listaColores.push("bg-black");

        let indicePreseleccionado = 0;
        if (estadoFiltros.color) {
          const idx = listaColores.findIndex(
            (c) => claseTailwindAColorCSS(c).hex === estadoFiltros.color,
          );
          if (idx !== -1) indicePreseleccionado = idx;
        }

        listaColores.forEach((claseColor, index) => {
          const infoColor = claseTailwindAColorCSS(claseColor);
          const botonColor = document.createElement("button");
          botonColor.type = "button";
          botonColor.className = `color-option w-9 h-9 rounded-full border border-gray-300 transition-all flex items-center justify-center focus:outline-none ${claseColor}`;
          botonColor.style.backgroundColor = infoColor.hex;
          botonColor.title = infoColor.nombre;
          botonColor.onclick = () =>
            seleccionarColorModal(claseColor, infoColor.nombre, botonColor);

          contenedorColores.appendChild(botonColor);

          if (index === indicePreseleccionado) {
            seleccionarColorModal(claseColor, infoColor.nombre, botonColor);
          }
        });

        const tallaInicial = estadoFiltros.talla || "M";
        document
          .querySelectorAll("#modal-tallas-contenedor .talla-btn")
          .forEach((b) => {
            if (b.textContent.trim() === tallaInicial) {
              seleccionarTallaModal(tallaInicial, b);
            }
          });

        document.getElementById("modal-interes").classList.remove("hidden");
      }

      function seleccionarColorModal(valorColor, etiquetaNombre, btnElemento) {
        document.getElementById("modal-color-seleccionado").value = valorColor;
        document.getElementById("modal-color-etiqueta").textContent =
          etiquetaNombre;

        document
          .querySelectorAll("#modal-colores-contenedor .color-option")
          .forEach((b) => {
            b.classList.remove(
              "ring-2",
              "ring-offset-2",
              "ring-blue-600",
              "scale-110",
            );
          });

        btnElemento.classList.add(
          "ring-2",
          "ring-offset-2",
          "ring-blue-600",
          "scale-110",
        );
      }

      function seleccionarTallaModal(talla, btnElemento) {
        document.getElementById("modal-talla-seleccionada").value = talla;
        document
          .querySelectorAll("#modal-tallas-contenedor .talla-btn")
          .forEach((b) => {
            b.className =
              "talla-btn border border-gray-300 py-2 text-xs font-bold rounded hover:border-gray-900 transition-colors";
          });
        btnElemento.className =
          "talla-btn border-2 border-gray-900 bg-gray-900 text-white py-2 text-xs font-bold rounded transition-colors";
      }

      function cerrarModalInteres() {
        document.getElementById("modal-interes").classList.add("hidden");
      }

      function irALoginDesdeModal() {
        cerrarModalInteres();
        if (typeof openLoginModal === "function") {
          openLoginModal();
        }
      }

      async function agregarAlCarritoSinRecargar(event) {
        event.preventDefault();

        const form = document.getElementById("form-agregar-carrito");
        const btnSubmit = document.getElementById("btn-submit-carrito");
        const formData = new FormData(form);
        const nombreProd =
          document.getElementById("modal-prod-nombre").textContent;
        const tallaElegida = document.getElementById(
          "modal-talla-seleccionada",
        ).value;
        const cantidadElegida = document.getElementById("modal-cantidad").value;

        if (btnSubmit) btnSubmit.disabled = true;

        try {
          const response = await fetch("/cart/agregar-ajax", {
            method: "POST",
            body: new URLSearchParams(formData),
          });

          if (response.ok) {
            const data = await response.json();
            actualizarBurbujaHeader(data.carritoCantidad);
            cerrarModalInteres();
            mostrarToast(
              `${cantidadElegida}x ${nombreProd} (Talla ${tallaElegida})`,
            );
          }
        } catch (error) {
          console.error("Error al agregar al carrito:", error);
        } finally {
          if (btnSubmit) btnSubmit.disabled = false;
        }
      }

      function actualizarBurbujaHeader(cantidad) {
        let badge =
          document.getElementById("cart-badge") ||
          document.querySelector('a[aria-label="Carrito"] span');

        if (!badge) {
          const linkCarrito = document.querySelector('a[aria-label="Carrito"]');
          if (linkCarrito) {
            badge = document.createElement("span");
            badge.id = "cart-badge";
            badge.className =
              "absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center";
            linkCarrito.appendChild(badge);
          }
        }

        if (badge) {
          badge.textContent = cantidad;
          if (cantidad > 0) {
            badge.classList.remove("hidden");
            badge.classList.add("flex");
          }
        }
      }

      function mostrarToast(textoDetalle) {
        const toast = document.getElementById("toast-carrito");
        document.getElementById("toast-detalle").textContent = textoDetalle;

        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.remove("translate-y-4", "opacity-0");
        }, 10);

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.add("translate-y-4", "opacity-0");
          setTimeout(() => toast.classList.add("hidden"), 300);
        }, 3000);
      }

      document
        .getElementById("modal-interes")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            cerrarModalInteres();
          }
        });
    </script>
